[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verirehost"
version = "0.1.0"
description = "Evidence-graded selective rehosting for firmware trust decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "VeriRehost contributors"}
]
keywords = ["firmware", "rehosting", "trusted-boot", "arm64", "security-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
exact = ["unicorn>=2.1,<3"]

[project.scripts]
verirehost = "verirehost.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
