    <path d="M1188 208V223H1204" stroke="#64e8c8" stroke-width="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="700" y="193" fill="#d8dde3" font-size="10" font-weight="700" letter-spacing="1.15">ARTIFACT</text>
    <text x="700" y="211" fill="#65717d" font-size="9" letter-spacing="0.75">SHA-256 / SIZE</text>

    <text x="842" y="193" fill="#d8dde3" font-size="10" font-weight="700" letter-spacing="1.15">EXACT SLICE</text>
